<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img"><title>Taylor Wessing toolkit</title><desc>Conceptual navigation graphic. Original investigation materials are preserved separately.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2a4050" opacity=".23" stroke-width=".6"/></pattern><radialGradient id="aura"><stop stop-color="#79c9df" stop-opacity=".12"/><stop offset="1" stop-color="#79c9df" stop-opacity="0"/></radialGradient><clipPath id="edge"><rect x="1" y="1" width="1278" height="458" rx="12"/></clipPath></defs>
<style>@keyframes pulse{0%,100%{opacity:.12}40%,60%{opacity:.9}}.pulse{animation:pulse 6s ease-in-out infinite}@keyframes mask{0%,15%,90%,100%{transform:translate(0,0)}40%,65%{transform:translate(20px,-65px)}}.mask{animation:mask 6s ease-in-out infinite}@keyframes scan{0%,100%{transform:translateY(0);opacity:0}15%,80%{opacity:.75}85%{transform:translateY(190px)}}.scan{animation:scan 6s linear infinite}@media(prefers-reduced-motion:reduce){.pulse,.mask,.scan{animation:none}}</style>
<g clip-path="url(#edge)"><rect width="1280" height="460" fill="#0a121b"/><rect width="1280" height="460" fill="url(#grid)"/><ellipse cx="1010" cy="230.0" rx="400" ry="270" fill="url(#aura)"/><text x="45" y="42" fill="#79c9df" font-family="Consolas,monospace" font-size="14" font-weight="650" text-anchor="start">PHISHDESTROY</text><text x="45" y="78" fill="#9dafc1" font-family="Consolas,monospace" font-size="12" font-weight="400" text-anchor="start">TAYLOR WESSING / PDF REDACTION AUDIT</text><text x="45" y="174" fill="#f0f5fa" font-family="Segoe UI,Arial,sans-serif" font-size="47" font-weight="700" text-anchor="start">A black box</text><text x="45" y="233" fill="#79c9df" font-family="Segoe UI,Arial,sans-serif" font-size="47" font-weight="700" text-anchor="start">is not redaction.</text><text x="45" y="286" fill="#bbcbd9" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start">PDF Redaction Auditor &amp; Layer Decomposer</text><path d="M45 320H580" stroke="#304452"/><text x="45" y="353" fill="#859aaf" font-family="Consolas,monospace" font-size="12" font-weight="400" text-anchor="start">OPEN SOURCES. LASTING EVIDENCE.</text><g transform="translate(660 55)"><text x="0" y="12" fill="#79c9df" font-family="Consolas,monospace" font-size="13" font-weight="600" text-anchor="start">VISUAL MASK ≠ REMOVED TEXT</text><g transform="translate(55 37)"><rect x="12" y="12" width="235" height="260" rx="10" fill="#152435" stroke="#3a5269"/><rect width="235" height="260" rx="10" fill="#e0e8ef" stroke="#c4d5df"/><text x="22" y="34" fill="#243f54" font-family="Consolas,monospace" font-size="14" font-weight="650" text-anchor="start">PDF / LAYER STUDY</text><path d="M22 65h175" stroke="#8da6b8" stroke-width="5"/><path d="M22 85h155" stroke="#8da6b8" stroke-width="5"/><path d="M22 169h175" stroke="#8da6b8" stroke-width="5"/><path d="M22 190h140" stroke="#8da6b8" stroke-width="5"/><path d="M22 211h163" stroke="#8da6b8" stroke-width="5"/><text x="22" y="132" fill="#243f54" font-family="Consolas,monospace" font-size="23" font-weight="700" text-anchor="start">TEXT LAYER</text><g class="mask"><rect x="16" y="106" width="202" height="35" rx="2" fill="#11161c"/><text x="117" y="129" fill="#d1dce7" font-family="Consolas,monospace" font-size="13" font-weight="600" text-anchor="middle">VISUAL MASK</text></g><path class="scan" d="M-9 43H248" stroke="#79c9df" stroke-width="2"/></g><path d="M309 158H362" stroke="#466172" stroke-width="1.5"/><g transform="translate(362 80)"><rect width="190" height="67" rx="8" fill="#111d29" stroke="#354b5b"/>
<rect class="pulse" style="animation-delay:0s" width="190" height="67" rx="8" fill="none" stroke="#79c9df"/>
<text x="95.0" y="30" fill="#e5eef9" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="650" text-anchor="middle">LAYER 01</text><text x="95.0" y="52" fill="#9badbf" font-family="Consolas,monospace" font-size="12" font-weight="400" text-anchor="middle">VISUAL OVERLAY</text></g><g transform="translate(362 181)"><rect width="190" height="67" rx="8" fill="#111d29" stroke="#354b5b"/>
<rect class="pulse" style="animation-delay:3s" width="190" height="67" rx="8" fill="none" stroke="#79c9df"/>
<text x="95.0" y="30" fill="#e5eef9" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="650" text-anchor="middle">LAYER 02</text><text x="95.0" y="52" fill="#9badbf" font-family="Consolas,monospace" font-size="12" font-weight="400" text-anchor="middle">UNDERLYING TEXT</text></g></g><path d="M32 398H1248" stroke="#304452"/><text x="45" y="422" fill="#a6bacb" font-family="Consolas,monospace" font-size="12" font-weight="600" text-anchor="start">INSPECT / DECOMPOSE / VERIFY</text><path d="M1 0V460" stroke="#79c9df" stroke-width="4" opacity=".8"/></g><rect x=".5" y=".5" width="1279" height="459" rx="12" fill="none" stroke="#304452"/></svg>